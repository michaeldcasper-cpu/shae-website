<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | {name}</title>
  <meta name="description" content="Photography and film portfolio."><!-- TODO: real description -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
  <main class="container page-top">
    <p class="eyebrow reveal">Contact</p>
    <h1 class="reveal">Let's make something.</h1>
    <p class="muted reveal" style="max-width:560px;margin-bottom:3rem">Available for sports, events, documentary and commercial work. Tell me about your project and I'll be in touch.</p>
    <div class="contact-grid">
      <div id="contact-details" class="reveal"></div>
      <form class="contact-form reveal" id="contact-form">
        <label>Name <input name="name" required autocomplete="name"></label>
        <label>Email <input name="email" type="email" required autocomplete="email"></label>
        <label>Project type
          <select name="subject">
            <option>Sports</option><option>Event</option><option>Documentary / Film</option><option>Portraits</option><option>Other</option>
          </select>
        </label>
        <label>Message <textarea name="message" rows="6" required></textarea></label>
        <button class="btn" type="submit">Send message</button>
        <p id="form-status" class="muted small" role="status"></p>
      </form>
    </div>
  </main>
  <script src="assets/js/site-data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
