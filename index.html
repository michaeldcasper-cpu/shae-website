<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{name}</title>
  <meta name="description" content="Photography and film portfolio."><!-- TODO: real description -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home">
  <main>
    <!-- Hero: full-screen wall of sliding photo rows, name cut out of a dark veil -->
    <section class="reel-hero" id="reel-hero">
      <div class="reel-stage" id="reel"></div>
      <svg class="reel-veil" id="reel-veil" aria-hidden="true"></svg>
      <div class="reel-text">
        <h1 class="visually-hidden" id="hero-name"></h1>
        <a class="btn hero-btn" href="#portfolio">Portfolio</a>
      </div>
      <a class="scroll-cue" href="#featured" aria-label="Scroll to featured projects"></a>
    </section>

    <!-- Films: Odyssey full width on top, the other two paired beneath (triangle) -->
    <section class="section" id="featured">
      <div class="container">
        <div class="section-head reveal">
          <div><p class="eyebrow">Films</p><h2>Featured Projects</h2></div>
        </div>
        <div class="featured-grid featured-triangle" id="featured-grid"></div>
      </div>
    </section>

    <!-- Portfolio: endless scroll of every photo, mixed so no shoot clumps together -->
    <section class="feed-section" id="portfolio" aria-label="Portfolio">
      <div class="feed" id="feed"></div>
      <div class="feed-sentinel" id="feed-sentinel" aria-hidden="true"></div>
    </section>
  </main>
  <script src="assets/js/site-data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
