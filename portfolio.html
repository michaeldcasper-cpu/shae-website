<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio | {name}</title>
  <meta name="description" content="Photography and film portfolio."><!-- TODO: real description -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="portfolio">
  <main>
    <!-- Every photo in one big collage; click any photo to view it full size -->
    <section class="portfolio-wrap page-top">
      <div class="portfolio-head">
        <p class="eyebrow reveal">Portfolio</p>
        <h1 class="reveal">All Work</h1>
      </div>
      <div class="gallery portfolio-grid" id="portfolio-grid"></div>
    </section>

    <!-- Films at the bottom: click to play the full video -->
    <section class="section" id="featured">
      <div class="container">
        <div class="section-head reveal">
          <div><p class="eyebrow">Films</p><h2>Video</h2></div>
        </div>
        <div class="featured-grid" id="featured-grid"></div>
      </div>
    </section>
  </main>
  <script src="assets/js/site-data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
